[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexusrag"
version = "0.1.0"
description = "Production-style private-document RAG knowledge assistant."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "chromadb",
    "fastapi",
    "httpx",
    "pypdf",
    "python-docx",
    "python-multipart",
    "rank-bm25",
    "sentence-transformers",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "reportlab",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app", "app.*"]
exclude = ["data*", "tests*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]