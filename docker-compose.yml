services:
  nexusrag:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: nexusrag-api

    ports:
      - "8000:8000"

    environment:
      NEXUSRAG_OLLAMA_MODEL: ${NEXUSRAG_OLLAMA_MODEL:-qwen3:4b}
      NEXUSRAG_OLLAMA_BASE_URL: ${NEXUSRAG_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      NEXUSRAG_OLLAMA_TIMEOUT: ${NEXUSRAG_OLLAMA_TIMEOUT:-300}
      NEXUSRAG_VECTOR_STORE_DIR: /app/data/vector_store
      NEXUSRAG_LOG_LEVEL: ${NEXUSRAG_LOG_LEVEL:-INFO}

    volumes:
      - nexusrag_data:/app/data
      - ./app:/app/app

    restart: unless-stopped

volumes:
  nexusrag_data: